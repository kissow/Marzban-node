name: Mr.shaw Node fork image

on:
  push:
    branches:
      - master
      - feature/**
    tags:
      - mrshaw-v*
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Node features
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify activity RPC against fixed Xray core
        env:
          XRAY_TEST_BINARY: ${{ runner.temp }}/xray-test/xray
        run: |
          curl -fsSL https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip -o "$RUNNER_TEMP/xray-test.zip"
          unzip -q "$RUNNER_TEMP/xray-test.zip" -d "$RUNNER_TEMP/xray-test"
          chmod +x "$XRAY_TEST_BINARY"
          "$XRAY_TEST_BINARY" version | head -n 1 | grep -F 'Xray 26.3.27 '
          python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'
      - uses: docker/setup-buildx-action@v3
        if: github.event_name != 'pull_request'
      - name: Authenticate to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify formal Xray core pin
        if: github.event_name != 'pull_request'
        run: |
          test "$(grep -m1 '^ARG XRAY_CORE_VERSION=' Dockerfile | cut -d= -f2 | tr -d '\r')" = "v26.3.27"
          test "$(grep -m1 'XRAY_CORE_VERSION=v26.3.27' .github/workflows/build.yml)" != ""
          ! grep -n -E 'XRAY_CORE_VERSION=v(25|26\.9\.9)' Dockerfile
      - name: Image tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kissow/marzban-node
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha
            type=ref,event=tag
      - name: Build and publish fork image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            XRAY_CORE_VERSION=v26.3.27
